experiment:
  name: scheduler_experiment
  seed: 303
  device: auto

data:
  dataset: cifar10
  num_classes: 10
  batch_size: 128
  num_workers: 2

model:
  architecture: resnet18
  ensemble_size: 3

training:
  epochs: 30
  learning_rate: 0.01
  weight_decay: 0.0001

  scheduler:
    name: step_lr
    step_size: 10
    gamma: 0.1