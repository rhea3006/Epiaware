experiment:
  name: baseline_cifar10
  seed: 101
  device: auto

data:
  dataset: cifar10
  num_classes: 10
  batch_size: 128
  num_workers: 2
  corruptions:
    gaussian_noise:
      benchmark: cifar10-c
      normalized_standard_deviations: [0.04, 0.06, 0.08, 0.09, 0.10]
      uint8_standard_deviations: [10.2, 15.3, 20.4, 22.95, 25.5]
    gaussian_blur:
      benchmark: cifar10-c-extra
      gaussian_filter_sigmas: [0.4, 0.6, 0.7, 0.8, 1.0]
    rotation:
      benchmark: custom
      angles_degrees: [5, 10, 15, 20, 25]
      interpolation: bilinear
      fill_value: 0

model:
  architecture: resnet18
  ensemble_size: 3

training:
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
